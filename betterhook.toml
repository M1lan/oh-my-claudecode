# betterhook configuration for oh-my-claudecode.

[meta]
version = 1

[hooks.pre-commit]
parallel = false
fail_fast = true
stash_untracked = false
priority = ["pnpm-rmux-guard"]

[hooks.pre-commit.jobs.pnpm-rmux-guard]
# BASH_ENV= : the machine-global agent-shell harness (DEBUG trap) multiplies
# the guard's per-line loop ~25x (11s -> ~5min on a large merge diff).
run = "BASH_ENV= bash scripts/pnpm-rmux-guard.bash --staged"
reads = ["**/*"]
writes = []
concurrent_safe = true
timeout = "1m"
